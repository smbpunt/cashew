---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}cashew-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
    volumes:
      # Uploaded statements wait there for the worker
      - share_data:/app/var/share

  worker:
    image: ${IMAGES_PREFIX:-}cashew-php-prod
    # Back to the image's entrypoint, which switches from root to PUID/PGID
    entrypoint: ["docker-entrypoint"]
    environment:
      APP_SECRET: ${APP_SECRET}
    volumes:
      - share_data:/app/var/share

volumes:
  share_data:
