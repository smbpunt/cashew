---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: playground
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Rebuilds the Tailwind CSS whenever a template or asset changes
  tailwind:
    # Same image as php, which builds it
    image: ${IMAGES_PREFIX:-}app-php-dev
    pull_policy: never
    # Bypass the app entrypoint (composer install, migrations): the php service already runs it
    entrypoint: ["docker-php-entrypoint"]
    command: ["php", "bin/console", "tailwind:build", "--watch"]
    # php's mounts, including its /app/var volume: the CSS must be built where php serves it from
    volumes_from:
      - php
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "off"
    # The image's healthcheck probes FrankenPHP, which doesn't run here (and would fail "up --wait")
    healthcheck:
      disable: true
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
  # Stops itself once the code it runs changes (StopWorkerOnStaleContainer), to be restarted on the new code
  worker:
    # Same image as php, which builds it
    image: ${IMAGES_PREFIX:-}app-php-dev
    pull_policy: never
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=256M"]
    # php's mounts, including its /app/var volume, where uploaded statements wait for the worker
    volumes_from:
      - php
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "off"

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
