# ICU MessageFormat: https://symfony.com/doc/current/reference/formats/message_format.html
home:
    title: Cashew, vos entrées et sorties d’argent, mois par mois
    headline: Voyez où va votre argent
    pitch: Importez vos relevés bancaires et retrouvez chaque mois vos entrées et vos sorties d’un coup d’œil, comptées le jour du paiement, carte à débit différé ou non.
    log_in: Se connecter
    features:
        statements:
            title: Les exports de vos banques
            description: Relevés CSV du Crédit Agricole et de Revolut, même s’ils se chevauchent.
        months:
            title: Mois par mois
            description: Ce qui est entré, ce qui est sorti, et ce qui reste.
        privacy:
            title: Confidentiel
            description: Les fichiers des relevés sont supprimés dès leur import.

nav:
    label: Principale
    dashboard: Tableau de bord
    import: Importer

theme:
    toggle: Basculer le thème sombre

dashboard:
    title: Tableau de bord
    months: Mois
    previous_month: Mois précédent
    next_month: Mois suivant
    income: Entrées
    spending: Sorties
    balance: Solde
    transactions: Transactions
    no_transactions: Aucune transaction en {month}.
    importing:
        title: '{count, plural, one {Import de votre relevé en cours…} other {Import de vos # relevés en cours…}}'
        description: 'Cette page se mettra à jour toute seule une fois l’import terminé. Vous pouvez aussi la quitter : vos transactions vous attendront.'
    empty:
        title: Aucune donnée pour l’instant
        description: Importez les relevés de vos comptes bancaires pour voir vos entrées et vos sorties d’argent.
        waiting_for_month_end: 'Vos relevés ne contenaient que des transactions du mois en cours : exportez un nouveau relevé une fois le mois terminé, à partir du {date}.'
        import: Importer des relevés

locale:
    switcher: Langue

security:
    log_out: se déconnecter
    login:
        title: Connexion
        description: Saisissez votre identifiant et votre mot de passe.
        login: Identifiant
        password: Mot de passe
        submit: Se connecter

statement:
    import:
        title: Importer des relevés
        description: Les exports de vos banques, importés en arrière-plan.
        status:
            pending: En attente…
            processing: Import en cours…
            failed: Échec
        completed:
            title: Import terminé
            redirecting: Direction votre tableau de bord…
            go: Aller au tableau de bord
            flash: '{count, plural, =0 {Relevés importés, sans nouvelle transaction.} one {# transaction importée.} other {# transactions importées.}}'
        result: >-
            {imported, plural, one {# importée} other {# importées}}{skipped, plural, =0 {} one {, # déjà connue} other {, # déjà connues}}{after_cutoff, plural, =0 {} other {, # pour le mois prochain}}
    upload:
        intro:
            first: Exportez <strong>tout l’historique</strong> de chacun de vos comptes, dans chaque banque, et déposez les fichiers ci-dessous.
            monthly: 'Une fois le mois terminé, exportez son relevé et déposez-le ci-dessous. Les exports peuvent se chevaucher : les transactions déjà importées sont ignorées.'
            supported: 'Pris en charge : Crédit Agricole (export CSV) et Revolut (relevé en français, CSV). Les transactions sont importées jusqu’à la fin du dernier mois complet, le {cutoff}.'
        placeholder: Déposez vos exports CSV ici, ou cliquez pour les choisir
        submit: Importer
        uploading: Envoi…
        imports: Imports
        leave: 'Vous pouvez quitter cette page : l’import continue en arrière-plan, et le tableau de bord l’affichera une fois terminé.'
    error:
        already_imported: '« {filename} » est déjà importé.'
        cannot_open: Le fichier du relevé ne peut pas être ouvert.
        unsupported_bank: Ce fichier n’est pas un export de relevé d’une banque prise en charge.
        not_an_amount: '« {value} » n’est pas un montant.'
        unknown_currency: 'Devise inconnue dans « {value} ».'
        not_a_date: '« {value} » n’est pas une date.'
        foreign_currency_amount: 'Un montant du compte « {account} » est en {currency}.'
        missing_column: 'Les transactions n’ont pas de colonne « {column} ».'
        transactions_before_account: Le relevé liste des transactions avant de nommer leur compte.
        unexpected: Une erreur est survenue pendant l’import de ce fichier.
