# ICU MessageFormat: https://symfony.com/doc/current/reference/formats/message_format.html
home:
    title: Cashew, your income and spending, month by month
    headline: See where your money goes
    pitch: Import your bank statements, and get every month's income and spending at a glance, counted on the day you paid, deferred debit card or not.
    log_in: Log in
    features:
        statements:
            title: Your bank exports
            description: Crédit Agricole and Revolut CSV statements, overlaps welcome.
        months:
            title: Month by month
            description: What came in, what went out, and what's left.
        privacy:
            title: Private
            description: Statement files are deleted as soon as they're imported.

nav:
    label: Main
    dashboard: Dashboard
    import: Import

theme:
    toggle: Toggle dark mode

dashboard:
    title: Dashboard
    months: Months
    previous_month: Previous month
    next_month: Next month
    income: Income
    spending: Spending
    balance: Balance
    transactions: Transactions
    no_transactions: No transactions in {month}.
    importing:
        title: '{count, plural, one {Importing your statement…} other {Importing your # statements…}}'
        description: 'This page updates itself once it''s done. You can also leave: your transactions will be waiting for you.'
    empty:
        title: No data yet
        description: Import the statements of your bank accounts to see your income and spending.
        waiting_for_month_end: 'Your statements only held transactions of the month in progress: export a new statement once it''s over, from {date}.'
        import: Import statements

locale:
    switcher: Language

security:
    log_out: log out
    login:
        title: Sign in
        description: Enter your login and password.
        login: Login
        password: Password
        submit: Sign in

statement:
    import:
        title: Import statements
        description: Your bank exports, imported in the background.
        status:
            pending: Waiting…
            processing: Importing…
            failed: Failed
        completed:
            title: Import complete
            redirecting: Taking you to your dashboard…
            go: Go to the dashboard
            flash: '{count, plural, =0 {Statements imported, with no new transactions.} one {# transaction imported.} other {# transactions imported.}}'
        result: >-
            {imported} imported{skipped, plural, =0 {} other {, # already known}}{after_cutoff, plural, =0 {} other {, # left for next month}}
    upload:
        intro:
            first: Export the <strong>full history</strong> of each of your accounts, from every bank, and drop the files below.
            monthly: 'Once a month is over, export its statement and drop it below. Exports may overlap: transactions already imported are skipped.'
            supported: 'Supported: Crédit Agricole (CSV export) and Revolut (statement in French, CSV). Transactions are imported up to the end of the last whole month, {cutoff}.'
        placeholder: Drop your CSV exports here, or click to pick them
        submit: Import
        uploading: Uploading…
        imports: Imports
        leave: 'You can leave this page: the import goes on in the background, and the dashboard will show it once it''s over.'
    error:
        already_imported: '"{filename}" is already imported.'
        cannot_open: The statement file can't be opened.
        unsupported_bank: This file isn't a statement export from a supported bank.
        not_an_amount: '"{value}" isn''t an amount.'
        unknown_currency: 'Unknown currency in "{value}".'
        not_a_date: '"{value}" isn''t a date.'
        foreign_currency_amount: 'An amount of the "{account}" account is in {currency}.'
        missing_column: 'The transactions have no "{column}" column.'
        transactions_before_account: The statement lists transactions before naming their account.
        unexpected: Something went wrong while importing this file.
