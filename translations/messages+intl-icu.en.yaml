        deferred_card_purchase: Deferred debit card
        internal_transfer: Internal transfer
    categories:
        title: By category
        fixed_charges: 'Fixed charges:'
        uncategorized: Uncategorized spending
    importing:
        title: '{count, plural, one {Importing your statement…} other {Importing your # statements…}}'
        description: 'This page updates itself once it''s done. You can also leave: your transactions will be waiting for you.'
    empty:
        title: No data yet
        description: Import the statements of your bank accounts to see your income and spending.
        waiting_for_month_end: 'Your statements only held transactions of the month in progress: export a new statement once it''s over, from {date}.'
        import: Import statements

locale:
    switcher: Language

review:
    title: Review your imports
    description: Transactions that come back were found. Confirm those that are, name them, and file them in a category.
    continue: Continue to the dashboard
    imports:
        title: '{count, plural, one {Statement imported} other {# statements imported}}'
        from_to: 'From {first} to {last}'
        on: 'On {date}'
        all_from_to: 'Transactions from {first} to {last}'
        all_on: 'Transactions on {date}'
    amount_changes:
        title: '{count, plural, one {An amount changed} other {# amounts changed}}'
        item: '{series}: {amount} on {date}, instead of {previous} on {previous_date}.'
    suggestions:
        title: '{count, plural, =0 {Recurring transactions} one {# recurring transaction to review} other {# recurring transactions to review}}'
        description: Subscriptions, bills, salaries, loans… Confirmed ones are recognised on each import, and count in their category.
        empty: Nothing left to review.
    series:
        name: Name
        category: Category
        no_category: No category
        confidence: '{confidence, number, percent} sure'
        occurrences: '{count, plural, one {# occurrence} other {# occurrences}}, the last one on {last}'
        confirm: Confirm
        reject: Not recurring
    transfers:
        title: '{count, plural, one {A transfer} other {# transfers}}'
        description: 'Filed in "{name}". Those between your accounts are left out of income and spending; those to someone else count as spending. File one elsewhere if it''s something else, like rent.'
        internal: Between your accounts
        external: To someone else
    categories:
        title: Categories
        description: 'Group what you spend on: Home, with its energy, water and loan…'

