framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # A message taken by a worker that died is taken again after 10 min, instead of an hour:
                    # longer than any import, whose lock (ImportStatementHandler) lasts as long
                    redeliver_timeout: 600
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # auto_setup=0: the table comes from the migrations only, like the async transport's
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Tests consume the messages themselves, from memory
                async: 'in-memory://'
