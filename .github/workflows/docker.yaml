---
# Publishes the prod image on Docker Hub, once the CI passed
name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yaml

  image:
    name: Image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # "latest" only comes with a final version (v1.2.3, not v1.2.3-rc.1).
      # Run by hand, the image is tagged with the name of the branch.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/cashew-php-prod
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      # Same image as compose.prod.yaml
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: frankenphp_prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
