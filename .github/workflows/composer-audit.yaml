---
# Runs on a schedule rather than on every PR, so a new advisory never blocks unrelated work.
# Scheduled workflows only run from the default branch.
name: Composer Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer
          coverage: none
      # Reads composer.lock only: no install needed. Fails on advisories, reports abandoned packages.
      - name: Audit dependencies
        run: composer audit --locked --abandoned=report
